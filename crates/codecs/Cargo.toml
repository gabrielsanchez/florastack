[package]
name = "florastack-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
florastack-core.workspace = true
serde.workspace = true
# The JSON schemas of the read and write options, which commands take as parameters.
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
rayon.workspace = true
lightcraft-tiff.workspace = true
lightcraft-codecs.workspace = true
lightcraft-meta.workspace = true
lightcraft-color.workspace = true
lightcraft-raw.workspace = true
png.workspace = true
tiff.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
image-webp.workspace = true
image.workspace = true
exr.workspace = true
miniz_oxide.workspace = true
weezl.workspace = true
moxcms.workspace = true

# Parallel EXR compression on native targets; the browser build (roadmap 7.3) stays single-threaded there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
exr = { workspace = true, features = ["rayon"] }

[dev-dependencies]
florastack-core = { workspace = true, features = ["testutil"] }
florastack-metrics.workspace = true
florastack-testkit.workspace = true
proptest.workspace = true
# The options' serde round trips.
toml.workspace = true
serde_json.workspace = true
