# A built-in preset (florastack-engine's `preset.list`): stacks shot through a microscope.
[preset]
name = "Microscope"
description = "Stacks through a microscope, the stage moved between frames: shift and brightness corrected (lamp flicker), no scale or rotation, dust on the sensor detected and painted out, cropped to what every frame covers; the pyramid with low grit against noise; a 16-bit TIFF."

[align]
shift_x = true
shift_y = true
scale = false
rotation = false
brightness = true
detect_defects = true
framing = "common"

[stack.pyramid]
grit = 0.25
range_limit = 1.0
tone = "compress"

[stack.depth_map]
radius = 2.0
smoothing = 12.0
threshold = "auto"

[output]
format = "tiff"
depth = "u16"
tiff_compression = "deflate"
profile = "input"
metadata = true
template = "{project} {name}"
