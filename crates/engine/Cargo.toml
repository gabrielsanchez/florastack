[package]
name = "florastack-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
florastack-core.workspace = true
florastack-codecs.workspace = true
florastack-raw.workspace = true
florastack-align.workspace = true
florastack-stack.workspace = true
florastack-gpu.workspace = true
florastack-project.workspace = true
florastack-retouch.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# The JSON schemas of the commands' parameters and results.
schemars.workspace = true
# The preview lane's thread pool (jobs::executor).
rayon.workspace = true

[dev-dependencies]
florastack-testkit.workspace = true
# Synthetic stacks, written as frame files, for the commands' tests and the quality runner.
florastack-core = { workspace = true, features = ["testutil"] }
# Arbitrary JSON thrown at every command.
proptest.workspace = true
# Scoring the stacking commands' outputs against the synthetic ground truth (tests/stack.rs, examples/quality).
florastack-metrics.workspace = true
# The peak heap of each command the quality runner (examples/quality, run by `cargo xtask quality`) times.
peak_alloc.workspace = true
