[package]
name = "florastack-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
florastack-core.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
# The JSON schema of the stacking settings, which the engine's commands take and check presets with.
schemars.workspace = true

[dev-dependencies]
# Synthetic stacks with known sharp images, for the quality tests and the benches.
florastack-core = { workspace = true, features = ["testutil"] }
# Scoring stacks against the ground truth: SSIM, PSNR, halo, noise and color shift.
florastack-metrics.workspace = true
criterion.workspace = true
# The settings' serde round trips, as a project file (JSON) and a preset (TOML) store them; the quality bench's records.
serde_json.workspace = true
toml.workspace = true
# The peak heap of a stack of 20 frames against one of 200 (tests/memory.rs).
dhat.workspace = true

[[bench]]
name = "stack"
harness = false

[[bench]]
name = "quality"
harness = false
