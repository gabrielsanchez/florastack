[package]
name = "florastack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The `testutil` module: the synthetic stack generator and procedural test scenes. Test code only: other crates
# enable it from [dev-dependencies], never by default (`cargo xtask check-layers` enforces both).
testutil = []

[dependencies]
thiserror.workspace = true

[build-dependencies]
# build.rs reads branding.toml into the constants of `florastack_core::branding`.
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# The crate itself with `testutil`, for its benches (its unit tests see the module without the feature).
florastack-core = { workspace = true, features = ["testutil"] }
criterion.workspace = true

[[bench]]
name = "synth"
harness = false
