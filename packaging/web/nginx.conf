# nginx serving the browser version's static site with the headers it needs (README.md says why): the Docker
# image's server (Dockerfile, at the repository's root), and an example for any nginx. Put the site's files in `root`.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's mime.types maps .wasm to application/wasm, which browsers require to compile the module as it streams in.
    gzip on;
    gzip_types application/wasm text/javascript application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Cross-origin isolation, which SharedArrayBuffer, and so the app's threads, need. `always`: on every answer.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The files' names stay the same from version to version: browsers must check them again.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
