# cargo-deny's policy for FloraStack's dependencies: `cargo deny check` (CI and `cargo xtask ci` run it) checks
# licenses, banned crates, sources and RustSec advisories against this file.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Every target platform and every feature, so that Windows-only, macOS-only and optional dependencies (such as
# camera control behind a cargo feature) are checked too.
all-features = true

[advisories]
# Vulnerable, unmaintained and unsound crates fail the check. Ignore an advisory only with a reason, in the same
# change that needs it: { id = "RUSTSEC-0000-0000", reason = "..." }. cargo audit reads the same ids from
# .cargo/audit.toml: keep the two lists the same.
ignore = [
    # quick-xml 0.38, through lightcraft-meta at the pinned LightCraft commit. Neither advisory reaches it: it reads
    # attributes with `with_checks(false)` only and never uses `NsReader` (checked at the pin). Fixed in quick-xml
    # 0.41: drop both entries when the pin moves past storytold/lightcraft#1464 (docs/lightcraft.md).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via lightcraft-meta, which never checks for duplicate attributes (with_checks(false)); fixed upstream in lightcraft#1464" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via lightcraft-meta, which never uses NsReader; fixed upstream in lightcraft#1464" },
    # zbus 5's companion crates, through AccessKit's Linux backend (accesskit_unix and atspi, under eframe's
    # `accesskit` feature): "unmaintained" because zbus 6 merged them, not for a flaw, and no AccessKit release is on
    # zbus 6 yet. Drop the three entries when eframe's AccessKit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 via accesskit_unix: merged into zbus 6, no flaw; AccessKit isn't on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 via accesskit_unix: merged into zbus 6, no flaw; AccessKit isn't on zbus 6 yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 via accesskit_unix: merged into zbus 6, no flaw; AccessKit isn't on zbus 6 yet" },
]

[licenses]
# Permissive licenses, plus MPL-2.0: its copyleft covers only the MPL-licensed files themselves, it is common in
# Rust dependency trees, and it doesn't reach FloraStack's own code. Everything else is denied, in particular GPL,
# LGPL and AGPL in every version (AGENTS.md, Clean-room). A crate offering a choice ("MIT OR GPL-3.0") passes when
# one of its options is allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
# The list is a policy, not an inventory: licenses that no dependency uses yet are expected.
unused-allowed-license = "allow"
confidence-threshold = 0.8
# Dev-dependencies are checked too: the clean-room rule covers test code.
include-dev = true
# Font licenses, allowed only for the crate that bundles egui's default fonts: OFL-1.1 (Noto Emoji) and the Ubuntu
# Font Licence (Ubuntu-Light). The desktop app adds egui in Phase 5; until then the exception matches nothing.
# The Independent JPEG Group's license, for jpeg-encoder alone (through LightCraft's codecs and raw crates): it is
# permissive, and asks only that binary distributions say "this software is based in part on the work of the
# Independent JPEG Group", which NOTICE does.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    { crate = "jpeg-encoder", allow = ["IJG"] },
]
unused-license-exception = "allow"

[licenses.private]
# Check FloraStack's own crates (MIT OR Apache-2.0) too.
ignore = false

[bans]
# Two versions of a crate are worth knowing about, not a failure.
multiple-versions = "warn"

[sources]
# Crates come from crates.io, and from the git sources listed here, each added in the same change that adds the
# dependency. LightCraft's crates aren't published, so they come from its repository, pinned to one commit
# (docs/lightcraft.md); a git dependency must name a `rev`, never a branch or a tag.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/storytold/lightcraft"]
required-git-spec = "rev"
