[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates. Which crate may depend on which is enforced by `cargo xtask check-layers`
# (the allowlist is RULES in xtask/src/layers.rs).
florastack-core = { path = "crates/core" }
florastack-codecs = { path = "crates/codecs" }
florastack-raw = { path = "crates/raw" }
florastack-align = { path = "crates/align" }
florastack-stack = { path = "crates/stack" }
florastack-gpu = { path = "crates/gpu" }
florastack-project = { path = "crates/project" }
florastack-retouch = { path = "crates/retouch" }
florastack-engine = { path = "crates/engine" }
florastack-metrics = { path = "crates/metrics" }
florastack-testkit = { path = "crates/testkit" }

# External crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
# Content hashes of frames and cache files (florastack-project): SHA-256, so that users can check them with any
# tool. RustCrypto's pure-Rust implementation; `oid` and `alloc` aren't needed.
sha2 = { version = "0.11", default-features = false }
# Moving old temporary projects to the operating system's trash (florastack-project's orphan cleanup, native
# targets only), never deleting them: the Recycle Bin through the shell's IFileOperation on Windows (the `windows`
# crate), NSFileManager on macOS (objc2) and the freedesktop.org trash specification on Linux and the BSDs (libc).
# No C code is compiled; those are the operating systems' own libraries. ATTRIBUTION.md has the details.
trash = "5.2"
# CPU parallelism (AGENTS.md, Conventions): parallel iterators over rows, tiles and frames.
rayon = "1.12"
# Logging in the libraries (AGENTS.md, Conventions); without the default `attributes` feature, which would compile
# proc macros for #[instrument] that FloraStack doesn't use.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# JSON schemas (draft 2020-12) of the command registry's parameters and results (florastack-engine), derived next to
# the serde derives of the types they describe (in florastack-project, -raw and -codecs too), for the CLI's
# `commands`, the MCP server's tool definitions and the generated command reference. Pure Rust, MIT; no optional
# integrations (chrono, uuid, url...).
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
# Property tests (dev-dependency). Only `std`: the default `fork` and `timeout` features run each case in a child
# process, which these tests don't need, and pull in rusty-fork and tempfile.
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Benchmarks only (dev-dependency): `cargo xtask bench` runs them and summarizes criterion's JSON estimates, so
# neither the HTML/plot reports (plotters) nor criterion's own rayon parallelism are needed. 0.7 is the newest release
# in pure Rust: 0.8 depends on `alloca`, which compiles C (AGENTS.md, Pure Rust).
criterion ={ version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Heap measurement in tests only (dev-dependency): its global allocator counts every allocation, so that a test can
# compare the peak heap of two runs (florastack-stack's tests/memory.rs) without unsafe code of FloraStack's own, as
# LightCraft's heap tests do. Pure Rust, MIT OR Apache-2.0.
dhat = "0.3"

# LightCraft's low-level crates (MIT OR Apache-2.0, pure Rust). They aren't published on crates.io, so they come from
# git, every one at the same commit: "Release 0.10.0" on main. docs/lightcraft.md says how to move the pin; deny.toml
# allows this one git source and requires a `rev`. FloraStack keeps their types out of its public APIs.
lightcraft-tiff = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }
# Without the default `jxl` and `avif` features, which FloraStack doesn't use: `avif` brings in rav1e and, through it,
# libfuzzer-sys, which compiles C++ with `cc`.
lightcraft-codecs = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c", default-features = false, features = ["parallel"] }
lightcraft-meta = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }
lightcraft-color = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }
# Without the default `jxl` feature here: florastack-raw turns it on for JPEG XL compressed DNGs (DNG 1.7), which
# florastack-codecs, using only the lossless-JPEG encoder, doesn't need.
lightcraft-raw = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c", default-features = false }
# The develop code florastack-raw uses besides lightcraft-raw's own (docs/lightcraft.md): noise reduction, lateral
# chromatic-aberration estimation and automatic white balance from the develop pipeline (whose tone curves, filmic
# shoulder and looks it never calls), the edit model that pipeline's noise-reduction parameters are read from, and
# the raster image and resampler they work on.
lightcraft-pipeline = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }
lightcraft-develop = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", rev = "a2a41383c4fd62fa85a46ccd00998639221f2d3c" }

# Image codecs that florastack-codecs uses directly, at the versions LightCraft already brings in (ATTRIBUTION.md says
# what each one does).
png = "0.18"
tiff = "0.11"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
image-webp = "0.2"
# The BMP decoder only; LightCraft's codecs enable image's other formats for themselves.
image = { version = "0.25", default-features = false, features = ["bmp"] }
# Exactly 1.74.0: 1.74.1 added lossy DWA compression through `pulp`, which pulls in the unmaintained `paste`
# (RUSTSEC-2024-0436). Without the default `rayon` feature; florastack-codecs turns it on for native targets only.
exr = { version = "=1.74.0", default-features = false }
# Deflate and LZW for the TIFF writer, as the tiff crate and LightCraft use them.
miniz_oxide = "0.8"
weezl = "0.1"
# The ICC profiles LightCraft's codecs don't write: gray ones, ones built from a file's chromaticities, and the linear
# twin of an input profile. The same version LightCraft uses.
moxcms = { version = "0.9", default-features = false }

[workspace.lints.rust]
# No unsafe code. A module that truly needs it opts in with #[allow(unsafe_code)] and is listed in
# AGENTS.md; `deny` rather than `forbid` keeps that possible.
unsafe_code = "deny"

[workspace.lints.clippy]
# Pedantic everywhere: every crate opts in with `[lints] workspace = true` (checked by
# `cargo xtask check-layers`), and CI runs clippy with `-D warnings`. Lint levels can't be set in
# clippy.toml, which only configures lints. The group has a lower priority so the single-lint
# levels below override it.
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints, allowed everywhere:
# - suggests #[must_use] on nearly every pure function: clutter that catches nothing.
must_use_candidate = "allow"
# - wants an "# Errors" section on every pub fn that returns Result; the error enums document failures.
missing_errors_doc = "allow"
# - usize/u32 to f32 for pixel coordinates and sizes is exact below 2^24, beyond any image side.
cast_precision_loss = "allow"
# - x, y, w, h, r, g, b and a are the clearest names in pixel and geometry maths.
many_single_char_names = "allow"
# The other cast lints (truncation, sign loss, wrap) stay on: they are real bugs in index and offset
# maths. Keep pixel quantization in a few helpers that allow them locally.
#
# Leftover debugging and unfinished stubs (restriction lints, as in PhotoCraft and LightCraft).
dbg_macro = "warn"
todo = "warn"
# Never crash (AGENTS.md): no unwrap, expect or panicking macro outside tests. clippy.toml allows the first three
# in #[test] functions and #[cfg(test)] code; that leaves out integration-test helpers, examples and benches, so
# such a file that needs them starts with #![allow(clippy::unwrap_used, clippy::expect_used, clippy::panic)].
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
# Every unsafe block needs a `// SAFETY:` comment. unsafe itself is denied above, except in the modules AGENTS.md lists.
undocumented_unsafe_blocks = "warn"

# Unoptimized builds run pixel loops 10 to 50 times slower, which would make the alignment accuracy tests on synthetic
# stacks take minutes. The crates that do the pixel work are optimized in the dev profile, which the test profile
# inherits; debug assertions and overflow checks stay on, as everywhere in dev and test builds.
[profile.dev.package.florastack-core]
opt-level = 2

[profile.dev.package.florastack-align]
opt-level = 2

[profile.dev.package.florastack-stack]
opt-level = 2

# The metrics score every stacking test against its ground truth (SSIM over every frame of a stack).
[profile.dev.package.florastack-metrics]
opt-level = 2
