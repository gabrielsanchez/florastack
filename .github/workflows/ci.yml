# FloraStack CI: formatting, Clippy, the crate layering check, the test fixtures, the tests and the quality gate on
# Linux, macOS and Windows, plus the dependency policy (cargo deny with deny.toml, and cargo audit) and the book (its build
# and every link in it and in the repository's Markdown, with mdBook and lychee). `cargo xtask ci` runs the same
# cargo commands locally; a test in xtask/src/ci.rs keeps its list and this file's `run:` lines the same, so keep
# every cargo command on a single `run:` line.
#
# The toolchain comes from rust-toolchain.toml. Third-party actions are pinned to a full commit SHA, with the
# release in a comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    # macos-latest is an Apple silicon (arm64) runner.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The GPU agreement tests (crates/gpu/tests, crates/engine/tests/compute.rs) run on a software adapter where
        # the runner has one and must run there (`require_gpu`): Mesa's lavapipe (Vulkan) on Linux, installed below,
        # and WARP (DX12), which Windows has. macOS runs them on Metal if the runner exposes an adapter, and records
        # them as skipped otherwise.
        include:
          - os: ubuntu-latest
            require_gpu: "1"
          - os: macos-latest
            require_gpu: ""
          - os: windows-latest
            require_gpu: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub's runners. With no argument it installs the toolchain, components and
      # profile that rust-toolchain.toml names; it runs before the cache, whose key includes the rustc version.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # Caches the cargo registry and the compiled dependencies, keyed by OS, rustc version and Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Mesa's lavapipe, a software Vulkan driver, and the Vulkan loader: the GPU tests' adapter on Linux.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Crate layering
        run: cargo xtask check-layers

      # The test files corpus/manifest.toml pins: PngSuite and TIFF, WebP and OpenEXR files for the codecs (about
      # 3 MB) and one CC0 camera RAW file per format for florastack-raw (about 107 MB, from raw.pixls.us). They are
      # cached between runs, one cache for all three systems (the files are the same everywhere), so that a run only
      # downloads what a change to the manifest added and the hosts see each file about once; the fetch below checks
      # every file's SHA-256 all the same, and replaces any that fails.
      - name: Cache test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/fixtures
          key: corpus-fixtures-${{ hashFiles('corpus/manifest.toml') }}
          restore-keys: corpus-fixtures-
          enableCrossOsArchive: true

      # Downloaded into the gitignored corpus/fixtures/ and checked against their SHA-256. The tests that need them
      # read them there; run locally without them, those tests are skipped.
      - name: Fetch test fixtures
        run: cargo xtask corpus --fixtures

      # Khronos' official JS validator, pinned and installed outside the source tree; runners include Node.js.
      - name: Fetch glTF validator
        run: cargo xtask gltf-validator

      # FLORASTACK_REQUIRE_GPU turns a missing adapter into a failure of the GPU tests instead of a skip.
      - name: Test
        env:
          FLORASTACK_REQUIRE_GPU: ${{ matrix.require_gpu }}
        run: cargo test --workspace --locked

      # Runners provide Python; xtask creates a venv, installs maturin/NumPy/pytest and builds the extension.
      - name: Python bindings
        run: cargo xtask python

      - name: Clippy with dynamic camera control
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --features gphoto --locked -- -D warnings

      - name: Test with dynamic camera control
        if: runner.os != 'Windows'
        run: cargo test -p florastack-capture -p florastack-engine --features gphoto --locked

      # Every stacking method and slab combination on the synthetic stacks, scored against their ground truth and
      # compared with quality/baseline.json: fails when a measure is worse than the baseline by more than its tolerance
      # (runtimes aren't compared here, the baseline being measured on another machine). It runs the dev-profile build
      # of florastack-engine's `quality` example, which the tests above have built.
      - name: Quality gate
        run: cargo xtask quality --gate

  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      # Prebuilt, checksum-verified binaries, at the versions `cargo xtask ci` is checked with.
      - id: tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      # Licenses, banned crates, sources and RustSec advisories, as configured in deny.toml.
      - name: Dependency policy
        run: cargo deny check

      # Runs even when the policy check failed, so that both results show.
      - name: Security advisories
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: cargo audit

  docs:
    name: book and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      # mdBook's and lychee's release builds for Linux, at the versions `cargo xtask book` names, each checked against
      # its SHA-256 before it is installed.
      - name: Install mdBook and lychee
        run: |
          get() { curl --fail --location --silent --show-error --user-agent florastack-ci --output "$RUNNER_TEMP/$1" "$2"; echo "$3  $RUNNER_TEMP/$1" | sha256sum --check; }
          get mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
          get lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/mdbook" "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" "$HOME/.cargo/bin/"

      # Builds the book into target/book and checks every link in it and in the repository's Markdown: pages,
      # headings and the repository's own files, offline. The engine-command reference is checked against the
      # registry by the tests (crates/engine/tests/reference.rs).
      - name: Book
        run: cargo xtask book
