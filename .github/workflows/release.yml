# FloraStack's release. A version tag (v<version>, or v<version>-<suffix> for a pre-release, such as a test tag in a
# fork) builds every platform's packages with `cargo xtask dist`, which names them from branding.toml, refuses an app
# ID that still contains the OWNER placeholder, and checks the tag against the workspace version. One job then checks
# every run's SHA256SUMS.txt, writes the release's, and creates a draft GitHub release with all the files, to be
# reviewed and published by hand. book/src/dev/packaging.md explains the process and the signing secrets.
#
# The toolchain comes from rust-toolchain.toml. Third-party actions are pinned to a full commit SHA, with the
# release in a comment. Nothing is cached: release builds start clean.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled on x64, with MSVC's ARM64 tools; the wheel's Python import library is generated.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # Apple silicon: both architectures are built, and joined into universal files.
          - os: macos-latest
            target: universal-apple-darwin
          # Built against Ubuntu 22.04's glibc (2.35), so that the binaries run on the distributions released since.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # GitHub's arm64 runners, which are free for public repositories.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      # Whether the repository has signing secrets: without them (a fork, say), the macOS app is signed ad hoc and
      # isn't notarized.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub's runners: it installs what rust-toolchain.toml names, and the target.
      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi

      # maturin runs on any Python from 3.9: the bindings use the stable ABI, so one wheel serves them all.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install --locked cargo-wix --version 0.3.9

      # pkg-config, for the camera libraries' builds (Xcode provides the compiler and make).
      - name: Install the macOS packaging tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install pkgconf

      # Flatpak from its own PPA: Ubuntu 22.04's is too old for the current runtimes. desktop-file-utils lets
      # appimagetool validate the desktop entry.
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder rpm desktop-file-utils

      # A temporary keychain with the Developer ID Application certificate (a base64 .p12 and its password).
      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # The App Store Connect API key (the .p8 file's text) that notarytool signs in with.
      - name: Write the notary key
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARY_KEY == 'true'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the packages
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_APPLE_CERTIFICATE == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: cargo xtask dist --target ${{ matrix.target }} --out dist --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages

      # Checks each run's files against its SHA256SUMS.txt, gathers them, and writes the release's SHA256SUMS.txt
      # (the format `sha256sum --check` reads). A file that two runs made, such as the camera libraries' source
      # archives, must be the same in both.
      - name: Check and gather the packages
        run: |
          mkdir release
          for dir in packages/*/; do
            (cd "$dir" && sha256sum --check --strict SHA256SUMS.txt)
            while read -r hash name; do
              if [ -e "release/$name" ]; then
                [ "$(sha256sum < "release/$name" | cut -d ' ' -f 1)" = "$hash" ] || { echo "$name differs between runs" >&2; exit 1; }
              else
                cp "$dir$name" "release/$name"
              fi
            done < "${dir}SHA256SUMS.txt"
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* --repo "$REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes "${prerelease[@]}"
