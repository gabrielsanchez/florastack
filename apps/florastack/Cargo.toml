[package]
name = "florastack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
gphoto = ["florastack-engine/gphoto"]

[lib]
name = "florastack_app"
path = "src/lib.rs"

[[bin]]
name = "florastack"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
clap.workspace = true
png.workspace = true
florastack-engine.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
rfd.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
half.workspace = true
bytemuck.workspace = true
# Waiting for the viewer's shaders to compile (an error scope), at startup.
pollster.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit.workspace = true

# The browser build (`cargo xtask web`, `src/web.rs`): the page's files, downloads, console and canvas; and wgpu's
# WebGL backend, which draws the UI where the browser has no WebGPU (stacking needs WebGPU, and runs on the CPU
# otherwise).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Url",
    "UrlSearchParams",
    "Window",
    "console",
] }
wgpu = { workspace = true, features = ["webgl"] }

[dev-dependencies]
tokio.workspace = true
egui_kittest.workspace = true
florastack-testkit.workspace = true
# Frame files for the smoke test, as the CLI's tests write them.
