# cargo audit's configuration (CI and `cargo xtask ci` run it). Ignore an advisory only with the same id and reason
# as deny.toml's [advisories] ignore list, in the same change.
[advisories]
# zbus 5's companion crates through AccessKit's Linux backend, "unmaintained" since zbus 6 merged them. Drop the
# three when eframe's AccessKit moves to zbus 6.
# zip 7 (four advisories, all in ZipArchive::extract, never called) and paste (unmaintained) through candle-core 0.9.2,
# florastack-sam's SAM 3 inference, with four more zip 7 advisories in features candle doesn't enable or code it doesn't
# call, and chrono (unmaintained, no flaw) through LightCraft, schemars and rmcp (deny.toml has the reasons).
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    "RUSTSEC-2026-0543",
]
