# cargo audit's configuration (CI and `cargo xtask ci` run it). Ignore an advisory only with the same id and reason
# as deny.toml's [advisories] ignore list, in the same change.
[advisories]
# quick-xml 0.38 through lightcraft-meta, unreachable from its code (deny.toml has the reasons). Drop both when the
# LightCraft pin moves past storytold/lightcraft#1464, which bumps quick-xml to 0.41.
# zbus 5's companion crates through AccessKit's Linux backend, "unmaintained" since zbus 6 merged them. Drop the
# three when eframe's AccessKit moves to zbus 6.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195", "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]
